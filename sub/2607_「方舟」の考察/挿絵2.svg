<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 全体に遠近感を付与するグループ -->
  <g transform="translate(300, 300) matrix(1, 0.5, 0, 1, 0, 0) translate(-300, -300)">
  
  <rect y="-300" width="600" height="1200" fill="#1a1a2e"/>
  
  <!-- 森影側（下半分） -->
  <polygon points="0,300 600,300 600,600 0,1200" fill="#0a3a0a" opacity="0.9"/>
  
  <!-- 海面（分ける線） -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="#4A90E2" stroke-width="3" opacity="0.8"/>
  
  <!-- 森（上側） -->
  <!-- 木1 -->
  <polygon points="50,150 80,280 20,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木2 -->
  <polygon points="120,170 155,280 85,280" fill="#8B7355" opacity="0.65"/>
  <!-- 木3 -->
  <polygon points="180,160 215,280 145,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木4 -->
  <polygon points="240,180 275,280 205,280" fill="#8B7355" opacity="0.65"/>
  <!-- 木5 -->
  <polygon points="300,150 335,280 265,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木6 -->
  <polygon points="360,190 395,280 325,280" fill="#8B7355" opacity="0.65"/>
  <!-- 木7 -->
  <polygon points="410,160 445,280 375,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木8 -->
  <polygon points="470,175 505,280 435,280" fill="#8B7355" opacity="0.65"/>
  <!-- 木9 -->
  <polygon points="520,170 555,280 485,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木10 -->
  <polygon points="570,165 605,280 535,280" fill="#8B7355" opacity="0.65"/>
  <!-- 木11（左端追加） -->
  <polygon points="20,180 50,280 -10,280" fill="#8B7355" opacity="0.7"/>
  <!-- 木12（右端追加） -->
  <polygon points="580,155 610,280 550,280" fill="#8B7355" opacity="0.65"/>
  
  <!-- 森影（下側・鏡のように映った） -->
  <!-- 木1 -->
  <polygon points="50,450 80,320 20,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木2 -->
  <polygon points="120,430 155,320 85,320" fill="#4A6B3C" opacity="0.65"/>
  <!-- 木3 -->
  <polygon points="180,440 215,320 145,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木4 -->
  <polygon points="240,430 275,320 205,320" fill="#4A6B3C" opacity="0.65"/>
  <!-- 木5 -->
  <polygon points="300,450 335,320 265,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木6 -->
  <polygon points="360,430 395,320 325,320" fill="#4A6B3C" opacity="0.65"/>
  <!-- 木7 -->
  <polygon points="410,440 445,320 375,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木8 -->
  <polygon points="470,435 505,320 435,320" fill="#4A6B3C" opacity="0.65"/>
  <!-- 木9 -->
  <polygon points="520,430 555,320 485,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木10 -->
  <polygon points="570,435 605,320 535,320" fill="#4A6B3C" opacity="0.65"/>
  <!-- 木11（左端追加） -->
  <polygon points="20,430 50,320 -10,320" fill="#4A6B3C" opacity="0.7"/>
  <!-- 木12（右端追加） -->
  <polygon points="580,450 610,320 550,320" fill="#4A6B3C" opacity="0.65"/>
  
  </g>
  
  <!-- 星（森影側にきらめく・左下から右下にかけて広がる） -->
  <!-- 星1 -->
  <polygon points="130,390 138,402 130,414 122,402" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星2 -->
  <polygon points="250,430 258,442 250,454 242,442" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星3 -->
  <polygon points="100,470 108,482 100,494 92,482" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星4 -->
  <polygon points="320,480 328,492 320,504 312,492" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星5 -->
  <polygon points="200,520 208,532 200,544 192,532" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星6 -->
  <polygon points="80,450 88,462 80,474 72,462" fill="#FFD700" filter="url(#glow)"/>
  <!-- 星7 -->
  <polygon points="290,540 298,552 290,564 282,552" fill="#FFD700" filter="url(#glow)"/>
  
  <!-- ラベル -->
  <text x="450" y="50" fill="#FFFFFF" font-size="16">宇宙から見た地球</text>
  <text x="400" y="200" fill="#FFFFFF" font-size="14">枯れた森</text>
  <text x="400" y="530" fill="#FFFFFF" font-size="14">森影</text>
  <text x="170" y="500" fill="#FFFFFF" font-size="14">星座の船団</text>
</svg>
