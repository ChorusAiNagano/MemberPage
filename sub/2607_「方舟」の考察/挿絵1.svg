<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="500" fill="#000814"/>
  
  <!-- 太陽 -->
  <circle cx="300" cy="50" r="50" fill="#FDB813" opacity="0.3"/>
  <circle cx="300" cy="50" r="35" fill="#FDB813"/>
  
  <!-- 地球（反時計回りに90度回転） -->
  <g transform="rotate(-90 300 350)">
    <!-- 昼側（上側） -->
    <circle cx="300" cy="350" r="80" fill="#4A90E2"/>
    
    <!-- 夜側（下側） -->
    <circle cx="300" cy="350" r="80" fill="#0D1B2A" clip-path="url(#nightClip)"/>
    <defs>
      <clipPath id="nightClip">
        <rect x="220" y="270" width="80" height="160"/>
      </clipPath>
    </defs>
    
    <!-- 陸地（簡略） -->
    <path d="M 340 320 Q 360 310 370 330 Q 365 345 350 350 Q 355 360 345 370 Z" fill="#2D5016"/>
    
    <!-- 昼と夜の境界線 -->
    <line x1="300" y1="270" x2="300" y2="430" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- チリの層 -->
    <circle cx="300" cy="350" r="110" fill="none" stroke="#A0A0A0" stroke-width="8" opacity="0.6"/>
    <!-- チリの表現（点々） -->
    <circle cx="300" cy="350" r="110" fill="none" stroke="#C0C0C0" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
  </g>
  
  <!-- 方舟（複数） -->
  <!-- 方舟1 -->
  <g transform="translate(150, 120) rotate(150)">
    <!-- 方舟の船体 -->
    <polygon points="0,-15 20,10 -20,10" fill="#E8D5C4" stroke="#8B7355" stroke-width="2"/>
    <!-- 窓 -->
    <circle cx="0" cy="-5" r="3" fill="#4A90E2"/>
  </g>
  
  <!-- 方舟2 -->
  <g transform="translate(200, 90) rotate(150)">
    <polygon points="0,-15 20,10 -20,10" fill="#E8D5C4" stroke="#8B7355" stroke-width="2"/>
    <circle cx="0" cy="-5" r="3" fill="#4A90E2"/>
  </g>
  
  <!-- 方舟3 -->
  <g transform="translate(120, 150) rotate(150)">
    <polygon points="0,-15 20,10 -20,10" fill="#E8D5C4" stroke="#8B7355" stroke-width="2"/>
    <circle cx="0" cy="-5" r="3" fill="#4A90E2"/>
  </g>
  
  <!-- 移動経路（破線矢印） -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B6B"/>
    </marker>
  </defs>
  
  <!-- 方舟から地球の夜側（下側・チリ層内側）へ向かう経路（スイングバイ） -->
  <path d="M 150 100 Q 160 200 190 350 Q 220 440 300 445" 
        fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="8,6" 
        marker-end="url(#arrowhead)"/>
  
  <!-- ラベル -->
  <text x="300" y="370" text-anchor="middle" fill="#FFFFFF" font-size="20">地球</text>
  <text x="300" y="50" text-anchor="middle" fill="#FFFFFF" font-size="20">太陽</text>
  <text x="90" y="120" fill="#FFFFFF" font-size="16">方舟</text>
  <text x="180" y="250" fill="#FF6B6B" font-size="16">突入経路</text>
  <text x="310" y="290" fill="#FFFFFF" font-size="14">昼</text>
  <text x="310" y="415" fill="#CCCCCC" font-size="14">夜</text>
  <text x="400" y="280" fill="#A0A0A0" font-size="14">チリの層</text>
</svg>
